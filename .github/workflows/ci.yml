name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check backend
          ruff format --check backend
      - name: Typprüfung (mypy)
        run: mypy
      - name: Tests (Unit, Konformität, Integration)
        run: pytest -q --junitxml=pytest-report.xml
      - name: Konfig-Pakete validieren
        run: udsbench validate config/packages/*.example.yaml config/templates/*.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-report.xml

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: frontend-dist
          path: backend/udsbench/static

  e2e:
    name: API-Automatisierung (End-to-End)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/udsbench/static
      - run: pip install .
      - name: Server starten und Suite über die API ausführen
        run: |
          udsbench run --demo --no-browser --port 8765 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:8765/api/health && break; sleep 0.2; done
          curl -fs http://127.0.0.1:8765/ | grep -qi "<!doctype html"
          python examples/run_suite.py --suite full --junit udsbench-full.xml --json udsbench-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: udsbench-e2e-report
          path: udsbench-full.*

  package:
    name: Pakete (${{ matrix.os }})
    needs: [backend, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: backend/udsbench/static
      - run: pip install build ".[build]"
      - run: python -m build --wheel
      - run: pyinstaller --noconfirm packaging/udsbench.spec
      - uses: actions/upload-artifact@v4
        with:
          name: udsbench-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/udsbench*
